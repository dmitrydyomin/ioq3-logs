name: Build logs image

on:
  push:
    branches: [main]
    paths:
      - 'logs/**'
      - '.github/workflows/logs-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: hub.dma1.ru
          username: ${{ secrets.HUB_USERNAME }}
          password: ${{ secrets.HUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: logs
          push: true
          tags: 'hub.dma1.ru/ioq3-logs:latest'
          cache-from: type=gha,scope=logs
          cache-to: type=gha,mode=max,scope=logs
